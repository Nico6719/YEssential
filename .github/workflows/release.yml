name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'tooth.json'   # 只有 tooth.json 变动才触发

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 需要对比前一个 commit

      # ---------- 检测版本号 ----------
      - name: 检测版本号是否变化
        id: ver
        run: |
          NEW=$(jq -r '.version' tooth.json)
          OLD=$(git show HEAD~1:tooth.json 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "版本未变化 ($NEW)，跳过发布"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "版本变化: $OLD → $NEW，准备发布"
          fi

      # ---------- 防重复发布 ----------
      - name: 检查 Release 是否已存在
        id: relexists
        if: steps.ver.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.new }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $VERSION 已存在，跳过发布与同步"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 校验版本一致 ----------
      - name: 校验 manifest.json 与 tooth.json 版本一致
        if: steps.ver.outputs.changed == 'true'
        run: |
          TOOTH_VER="${{ steps.ver.outputs.new }}"
          MANIFEST_VER=$(jq -r '.version' manifest.json)

          echo "tooth.json    版本: $TOOTH_VER"
          echo "manifest.json 版本: $MANIFEST_VER"

          if [ "${TOOTH_VER#v}" != "${MANIFEST_VER#v}" ]; then
            echo "::error::版本号不一致！tooth.json=$TOOTH_VER，manifest.json=$MANIFEST_VER，请同步后重新 push"
            exit 1
          fi
          echo "版本号一致: $TOOTH_VER"

      # ---------- 提取更新日志 ----------
      - name: 提取本次版本的更新日志
        if: steps.ver.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.ver.outputs.new }}"
          awk -v head="## $VERSION" '
            !found && index($0, head) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          sed -i -e '/./,$!d' release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::warning::CHANGELOG.md 里没有 ## $VERSION 这一段，Release 说明将使用兜底文案"
            echo "本次更新内容请查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)" > release_notes.md
          fi

          echo "--- Release 说明 ---"
          cat release_notes.md

      # ---------- 打包 ----------
      - name: 打包 YEssential.zip
        if: steps.ver.outputs.changed == 'true'
        run: |
          mkdir -p dist/YEssential
          cp YEssential.js manifest.json dist/YEssential/
          cp -r modules dist/YEssential/
          rm -f dist/YEssential/modules/YEssentialAPI.js
          rm -f dist/YEssential/modules/TeleportSystemMigrator.js
          (cd dist && zip -r ../YEssential.zip YEssential)
          echo "--- 打包内容 ---"
          unzip -l YEssential.zip

      # ---------- 创建 GitHub Release ----------
      - name: 创建 Release 并上传
        if: steps.ver.outputs.changed == 'true' && steps.relexists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.new }}"
          gh release create "$VERSION" YEssential.zip \
            --title "$VERSION" \
            --notes-file release_notes.md

      # ---------- 同步到 MineBBS（新版 OpenAPI：versions + updates 两步）----------
      - name: 同步到 MineBBS
        if: steps.ver.outputs.changed == 'true' && steps.relexists.outputs.exists == 'false'
        env:
          MB_TOKEN: ${{ secrets.MINEBBS_TOKEN }}
          MB_RESOURCE_ID: ${{ secrets.MINEBBS_RESOURCE_ID }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.new }}"
          VER_PLAIN="${VERSION#v}"
          API="https://api.minebbs.com/api/openapi/v1"

          # ① 上传文件，拿 file_key（限速 8 次/小时）
          UPLOAD_RESP=$(curl -fsSL -X POST \
            "${API}/upload" \
            -H "Authorization: Bearer $MB_TOKEN" \
            -F "upload[]=@YEssential.zip")

          echo "$UPLOAD_RESP"
          FILE_KEY=$(echo "$UPLOAD_RESP" | jq -r '.data[0]')
          if [ -z "$FILE_KEY" ] || [ "$FILE_KEY" = "null" ]; then
            echo "::error::MineBBS 文件上传失败"; exit 1
          fi
          echo "file_key = $FILE_KEY"

          # ② 查已有版本，MineBBS 侧去重（已存在则直接跳过）
          EXISTING=$(curl -fsSL \
            "${API}/resources/${MB_RESOURCE_ID}/versions" \
            -H "Authorization: Bearer $MB_TOKEN")
          if echo "$EXISTING" | jq -e --arg v "$VER_PLAIN" \
               '.data[]? | select(.version_string == $v)' >/dev/null 2>&1; then
            echo "::notice::MineBBS 上已存在 $VER_PLAIN，跳过同步"
            exit 0
          fi

          # ③ 创建版本（file_key 与 file_url 二选一；Idempotency-Key 防重跑）
          CREATE_RESP=$(curl -fsSL -X POST \
            "${API}/resources/${MB_RESOURCE_ID}/versions" \
            -H "Authorization: Bearer $MB_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: ye-release-${VER_PLAIN}" \
            -d "{\"version_string\":\"${VER_PLAIN}\",\"file_key\":\"$FILE_KEY\"}")

          echo "$CREATE_RESP"
          CREATE_STATUS=$(echo "$CREATE_RESP" | jq -r '.status')
          if [ "$CREATE_STATUS" != "2000" ]; then
            echo "::error::MineBBS 创建版本失败, status=$CREATE_STATUS"; exit 1
          fi

          # ④ 发布更新日志（title 带 v；message 用 [MD] 包裹才会渲染 Markdown）
          DESC=$(printf '[MD]\n%s\n[/MD]' "$(cat release_notes.md)")

          jq -n --arg title "$VERSION" --arg msg "$DESC" \
            '{title:$title, message:$msg}' > mb_payload.json

          UPDATE_RESP=$(curl -fsSL -X POST \
            "${API}/resources/${MB_RESOURCE_ID}/updates" \
            -H "Authorization: Bearer $MB_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: ye-release-${VER_PLAIN}-log" \
            -d @mb_payload.json)

          echo "$UPDATE_RESP"
          UPDATE_STATUS=$(echo "$UPDATE_RESP" | jq -r '.status')
          if [ "$UPDATE_STATUS" != "2000" ]; then
            echo "::error::MineBBS 更新日志发布失败, status=$UPDATE_STATUS"; exit 1
          fi

          echo "已同步到 MineBBS: $VERSION"
